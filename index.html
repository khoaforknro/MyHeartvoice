<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Cậu...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }

        /* Nền Canvas - Chắc chắn hiển thị */
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Overlay chứa chữ - Nằm trên Canvas */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; }
        
        .message { color: #fff; font-size: 3rem; font-weight: 900; opacity: 0; transition: all 1s ease; transform: translateY(20px); text-align: center; text-shadow: 0 0 10px #ff00de; }
        .message.show { opacity: 1; transform: translateY(0); }
        
        .heart-neon { font-size: 6rem; filter: drop-shadow(0 0 15px #ff1493); animation: heartbeat 0.8s infinite; margin-bottom: 20px; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        /* Nút bắt đầu - Nằm trên cùng */
        #start-btn { position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff69b4; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-btn">Chạm vào màn hình để bắt đầu...</div>
    <canvas id="matrixCanvas"></canvas>
    <div id="overlay">
        <div id="text-display" class="message"></div>
    </div>

    <script>
        // 1. Vẽ Matrix
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight;
        
        const letters = "LOVE❤️🌸✨";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff1493";
            ctx.font = fontSize + "px monospace";
            
            drops.forEach((y, i) => {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            });
            requestAnimationFrame(draw);
        }
        draw();

        // 2. Logic thoại
        const script = ["Chào cậu,", "Tớ có điều này", "muốn nói...", "Em đồng ý", "Làm người yêu", "Anh nhé?", "<div class='heart-neon'>❤️</div><span>Anh Yêu Em</span>"];
        let idx = 0;
        const display = document.getElementById('text-display');

        function run() {
            if(idx < script.length) {
                display.innerHTML = script[idx];
                display.classList.add('show');
                setTimeout(() => {
                    display.classList.remove('show');
                    setTimeout(() => { idx++; run(); }, 800);
                }, 2500);
            }
        }

        // 3. Sự kiện bắt đầu
        document.getElementById('start-btn').onclick = function() {
            this.style.display = 'none';
            const audio = new Audio("https://raw.githubusercontent.com/khoaforknro/tinhto/refs/heads/main/audio_HIEUTHUHAI_download.mp3");
            audio.play();
            run();
        };
    </script>
</body>
</html>
